[project]
name = "opendma-demo-alfresco-haystack-basics"
version = "0.1.0"
description = "Sample Haystack applications for Alfresco content through OpenDMA"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "docling-haystack>=1.0.0",
    "haystack-ai>=2.0.0,<4.0.0",
    "opendma-haystack>=0.2.0",
    "openai>=1.0.0",
    "pypdf>=4",
    "rich>=13.0.0",
    "trafilatura>=1.8",
    "typer>=0.12.0",
]

[project.scripts]
alfresco-haystack-demo = "opendma_demo_alfresco_haystack_basics.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
